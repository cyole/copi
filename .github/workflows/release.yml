name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build - ${{ matrix.platform.os_name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os_name: Linux-x86_64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            archive: copi-Linux-x86_64.tar.gz

          - os_name: Linux-aarch64
            os: ubuntu-latest
            goos: linux
            goarch: arm64
            archive: copi-Linux-aarch64.tar.gz

          - os_name: macOS-x86_64
            os: macOS-latest
            goos: darwin
            goarch: amd64
            archive: copi-Darwin-x86_64.tar.gz

          - os_name: macOS-aarch64
            os: macOS-latest
            goos: darwin
            goarch: arm64
            archive: copi-Darwin-aarch64.tar.gz

          - os_name: Windows-x86_64
            os: windows-latest
            goos: windows
            goarch: amd64
            archive: copi-Windows-x86_64.zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        shell: bash
        run: |
          mkdir -p dist
          ext=""
          if [ "${{ matrix.platform.goos }}" = "windows" ]; then ext=".exe"; fi
          GOOS=${{ matrix.platform.goos }} GOARCH=${{ matrix.platform.goarch }} CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w" -o "dist/copi${ext}" ./cmd/copi

      - name: Package tar.gz
        if: matrix.platform.goos != 'windows'
        shell: bash
        run: |
          tar -C dist -czf "${{ matrix.platform.archive }}" copi

      - name: Package zip
        if: matrix.platform.goos == 'windows'
        shell: pwsh
        run: Compress-Archive -Path dist/copi.exe -DestinationPath ${{ matrix.platform.archive }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.os_name }}
          path: ${{ matrix.platform.archive }}

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release-assets/ \;
          ls -lh release-assets/

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Generate changelog and create release
        run: npx changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
